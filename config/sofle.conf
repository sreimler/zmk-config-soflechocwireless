# OLED plus RGB test build. Keep the OLED physically unplugged until insulated.
CONFIG_ZMK_DISPLAY=y

# The Sofle shield defines encoder sensors, so keep EC11 enabled for a clean link.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Start lit at modest brightness after flash/reset, unless persisted settings override it.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=25
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Keep external power separate so RGB off does not also shut off the OLED.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
